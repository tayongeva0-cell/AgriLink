            <a href="" style="display: flex; align-items: center; font-weight: 700; color: #3B7A57; text-decoration: none;">

        <!-- Auth Buttons -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="shopcart.html" style="font-size: 18px; text-decoration: none; cursor: pointer; color: #666666;">🛒</a>
            <a href="login.html" style="background: none; border: 1px solid #cccccc; padding: 8px 20px; border-radius: 20px; cursor: pointer;text-decoration: none; font-weight: 500; color: #555555;">Log In</a>
            <a href="signup.html" style="background-color: #3b7a57; border: none;text-decoration: none; color: white; padding: 8px 20px; border-radius: 20px;text-decoration: none cursor: pointer; font-weight: 500;">Sign Up</a>

    <body style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7faf7; color: #333333;">
   <div style="background: linear-gradient(#233a38, #3a5e5a); padding: 60px 20px 40px 20px; text-align: center;">
      <h1 style="color: #ffffff; margin: 0 0 10px 0; font-size: 2.5rem; font-weight: 600; letter-spacing: 0.5px;">Our Farmers</h1>
      <p style="color: #cbd5e1; margin: 0; font-size: 1.1rem; font-weight: 300;">Meet the people who grow your food</p>
  </div>

  <!-- Search and Filter Form Container -->
  <main style="max-width: 1200px; margin: auto 40px auto;">
    <form style=" padding: 150px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;">
      
      <!-- Input Group: Search by Name/Keyword -->
      <div style="flex: 1; min-width: 250px;">
        <label for="search-input" style="display: block; font-size: 0.85rem; color: #64748b; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Search by Farmer Name or Keyword</label>
        <input type="text" id="search-input" placeholder="e.g. Smith Farms, organic apples" style="width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 1rem; box-sizing: border-box; color: #1e293b; background-color: #f8fafc;">
      </div>

      <!-- Dropdown Group: Location/Region -->
      <div style="flex: 1; min-width: 200px;">
        <label for="location-select" style="display: block; font-size: 0.85rem; color: #64748b; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Filter by Region</label>
        <select id="location-select" style="width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 1rem; box-sizing: border-box; color: #1e293b; background-color: #f8fafc; appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 12px auto;">
          <option value="">All Regions</option>
          <option value="north">Northern Territory</option>
          <option value="south">Southern Valley</option>
          <option value="east">Eastern Coast</option>
          <option value="west">Western Hills</option>
        </select>
      </div>

      <!-- Action Button -->
      <div style="min-width: 120px;">
        <button type="submit" style="width: 100%; padding: 12px 24px; background-color: #3a5e5a; color: #ffffff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease-in-out; box-shadow: 0 2px 5px rgba(58, 94, 90, 0.2);">Search</button>
      </div>

    </form>
  </main>
  <div style="border-top: 1px solid rgba(255,255,255,0.08);background-color: darkslateblue; padding: 25px 40px;">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; font-size: 13px; color: #7f9bb0;">

      <div style="display: flex; align-items: center; gap: 4px;">Made with <span style="color: #e25555;">❤️</span> for local farmers</div>
    </div>
  </div>
</body>
</html>
